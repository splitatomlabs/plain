<!-- PLACEHOLDER ART — not final. See README.md. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-label="Carved relief-print profile of Marcus Aurelius, the Stoic emperor">
	<title>Marcus Aurelius — the Emperor</title>

	<defs>
		<pattern id="hatch-ma" patternUnits="userSpaceOnUse" width="22" height="22" patternTransform="rotate(35)">
			<line x1="0" y1="0" x2="0" y2="22" stroke="#404D61" stroke-width="5"/>
		</pattern>
	</defs>

	<!-- Paper ground -->
	<rect width="1000" height="1000" fill="#FAF7F2"/>

	<!-- Shoulders / toga, upright, largest of the three -->
	<path fill="#5B6E8A" d="M45 1000 C50 815 92 685 195 632 C305 582 410 558 495 552 Q575 545 655 558 C745 572 845 602 912 655 C962 700 975 838 977 1000 Z"/>

	<!-- Drapery fold hatch (far shoulder) -->
	<path fill="url(#hatch-ma)" d="M715 668 L805 692 L782 858 L690 830 Z"/>
	<path fill="none" stroke="#404D61" stroke-width="5" opacity="0.5" d="M335 705 C315 765 325 835 305 905"/>

	<!-- Round fibula clasp, near shoulder -->
	<circle cx="480" cy="600" r="20" fill="#FAF7F2"/>
	<circle cx="480" cy="600" r="20" fill="none" stroke="#404D61" stroke-width="6"/>

	<!-- Head + neck, near-profile facing left: bold brow, strong nose, lips, strong chin -->
	<path fill="#5B6E8A" d="M600 130 L520 145 L420 220 L460 250 L330 340 L365 368 L350 392 L372 402 L355 415 L378 428 L345 465 L390 500 L460 520 L540 530 L600 528 L630 545 L640 600 L636 660 L650 660 L655 600 L670 500 L700 420 Q730 330 730 240 Q725 155 680 150 Z"/>

	<!-- Neck shadow hatch -->
	<path fill="url(#hatch-ma)" d="M630 545 L640 590 L636 650 L604 645 L598 555 Z"/>

	<!-- Full hair, top and back of skull only (leaves a gap above jaw for the ear and beard to read separately) -->
	<path fill="#404D61" d="M420 220 L520 145 L600 130 L680 150 Q725 155 730 240 Q730 330 700 420 L670 500 L630 470 L648 400 Q662 320 645 260 Q615 210 570 198 L520 205 L470 235 Z"/>

	<!-- Laurel wreath: separate tapered leaves projecting past the hairline, tips pointing back toward the crown, gap before the tie at the back -->
	<g fill="#404D61">
		<path d="M0,0 Q18,-32 48,0 Q18,32 0,0 Z" transform="translate(432,195) rotate(230)"/>
		<path d="M0,0 Q18,-32 48,0 Q18,32 0,0 Z" transform="translate(472,163) rotate(245)"/>
		<path d="M0,0 Q18,-32 48,0 Q18,32 0,0 Z" transform="translate(510,133) rotate(258)"/>
		<path d="M0,0 Q18,-32 48,0 Q18,32 0,0 Z" transform="translate(556,120) rotate(268)"/>
		<path d="M0,0 Q18,-32 48,0 Q18,32 0,0 Z" transform="translate(596,114) rotate(278)"/>
		<path d="M0,0 Q18,-32 48,0 Q18,32 0,0 Z" transform="translate(642,116) rotate(295)"/>
		<path d="M0,0 Q18,-32 48,0 Q18,32 0,0 Z" transform="translate(682,130) rotate(312)"/>
	</g>
	<!-- band outline, so the leaves read as tied along a ribbon rather than floating -->
	<path fill="none" stroke="#404D61" stroke-width="6" stroke-linecap="round" opacity="0.85" d="M422 218 Q520 148 600 128 Q665 128 705 165"/>
	<!-- tie mark at the gap, suggesting the band continues out of frame at the back -->
	<path fill="none" stroke="#FAF7F2" stroke-width="5" stroke-linecap="round" opacity="0.75" d="M715 182 L730 172 M713 195 L732 192"/>

	<!-- Full curled beard, a distinct protruding mass, scalloped hem -->
	<path fill="#404D61" d="M365 368 C335 400 320 445 335 490 C345 525 365 555 390 575 L420 565 L445 580 L470 565 L495 580 L520 565 L545 578 L570 562 C580 545 590 535 600 528 L540 530 L460 520 L390 500 C375 480 365 450 362 420 C360 400 362 382 365 368 Z"/>
	<g fill="none" stroke="#FAF7F2" stroke-width="5" opacity="0.55">
		<path d="M375 490 Q390 505 378 520"/>
		<path d="M420 520 Q435 533 420 546"/>
		<path d="M465 530 Q480 542 465 554"/>
		<path d="M510 528 Q495 540 510 552"/>
	</g>

	<!-- Ear: a single hooked stroke, in the gap between hair and beard -->
	<path fill="none" stroke="#FAF7F2" stroke-width="10" stroke-linecap="round" d="M615 390 Q642 402 634 438 Q627 462 605 452"/>

	<!-- Eye: heavy carved lid line over a thin slot, no white, no pupil -->
	<path fill="none" stroke="#FAF7F2" stroke-width="12" stroke-linecap="round" d="M455 274 Q480 256 512 262"/>
	<path fill="none" stroke="#FAF7F2" stroke-width="6" stroke-linecap="round" d="M462 286 L508 280"/>
</svg>
