<!-- PLACEHOLDER ART — not final. See README.md. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-label="Carved relief-print profile of Seneca, the Stoic senator">
	<title>Seneca — the Senator</title>

	<defs>
		<pattern id="hatch-sn" patternUnits="userSpaceOnUse" width="22" height="22" patternTransform="rotate(35)">
			<line x1="0" y1="0" x2="0" y2="22" stroke="#4B5942" stroke-width="5"/>
		</pattern>
	</defs>

	<!-- Paper ground -->
	<rect width="1000" height="1000" fill="#FAF7F2"/>

	<!-- Shoulders, widest of the three -->
	<path fill="#6B7F5E" d="M30 1000 C35 810 80 675 190 620 C300 570 410 545 490 540 Q570 532 655 545 C750 560 855 592 925 648 C972 695 985 835 987 1000 Z"/>

	<!-- Latus clavus: broad band off-centre, running down the near shoulder and off the bottom edge -->
	<path fill="#4B5942" d="M395 555 C430 565 460 585 470 615 L440 1000 L370 1000 L378 600 Z"/>

	<!-- Drapery fold hatch (far shoulder) -->
	<path fill="url(#hatch-sn)" d="M720 672 L810 698 L788 862 L696 834 Z"/>

	<!-- Head + neck: bald dome (same ink throughout), set lower, leaning forward -->
	<g transform="translate(-10,88) scale(0.95) translate(600,560) rotate(-12) translate(-600,-560)">
		<path fill="#6B7F5E" d="M600 90 L520 110 L420 220 L460 250 L330 340 L365 368 L350 392 L372 402 L355 415 L378 428 L345 465 L390 500 L460 520 L540 530 L600 528 L630 545 L640 600 L636 660 L650 660 L655 600 L670 500 L700 420 Q745 320 745 220 Q735 130 680 115 Z"/>

		<!-- Neck shadow hatch -->
		<path fill="url(#hatch-sn)" d="M630 545 L640 590 L636 650 L604 645 L598 555 Z"/>

		<!-- Deep brow furrows carved into the high forehead -->
		<g fill="none" stroke="#4B5942" stroke-width="5" stroke-linecap="round" opacity="0.6">
			<path d="M440 195 Q470 172 505 176"/>
			<path d="M452 218 Q484 196 518 200"/>
		</g>

		<!-- Nasolabial fold: age carried in the line from nose to mouth -->
		<path fill="none" stroke="#FAF7F2" stroke-width="5" stroke-linecap="round" opacity="0.65" d="M362 378 Q350 394 344 410"/>

		<!-- Mouth: level, never upturned -->
		<path fill="none" stroke="#FAF7F2" stroke-width="7" stroke-linecap="round" d="M354 400 L386 406"/>

		<!-- Ear: a single hooked stroke -->
		<path fill="none" stroke="#FAF7F2" stroke-width="10" stroke-linecap="round" d="M615 390 Q642 402 634 438 Q627 462 605 452"/>

		<!-- Eye: heavy carved lid line over a thin slot, deep-set, no white, no pupil -->
		<path fill="none" stroke="#FAF7F2" stroke-width="12" stroke-linecap="round" d="M455 274 Q480 256 512 262"/>
		<path fill="none" stroke="#FAF7F2" stroke-width="6" stroke-linecap="round" d="M462 286 L508 280"/>
	</g>
</svg>
