# Cloud Run Job declarative config for the social pilot's daily publish job
# (Pf39c2-social-pilot-03 T10). This is the source of truth for the job's
# resources/timeout/service account/secrets — deploy it with:
#
#   gcloud run jobs replace social/cloud-run-job.yaml --region=us-central1
#
# (first deploy: `gcloud run jobs create` reads the same file shape via
# `--source`-less `replace`, which creates the job if it does not exist yet;
# see `social/DEPLOY.md` for the full sequence including building/pushing the
# image and creating the referenced secrets first). NOT applied by this
# session — no gcloud command has been run. Replace every `PROJECT_ID`
# placeholder below with the real GCP project id before applying.
#
# Container image: built from `social/Dockerfile` (repo-root build context,
# `--platform linux/amd64` — see `social/DOCKER.md`) and pushed to Artifact
# Registry at the `image:` path below.
#
# RESOURCES — deliberately NOT maxed out. The plan's Decision notes Cloud Run
# Jobs allow up to 168-hour timeout / 32 GiB / 8 vCPU, but a single day's
# render is one ~59s 1080x1920 video: one Playwright Chromium instance (the
# Instagram feed-still, `render/card.ts`), one Remotion "Chrome Headless
# Shell" instance (the video, sequential with the still, never concurrent —
# see `job.ts`), and one ffmpeg encode pass. `cpu: "2"` / `memory: 4Gi` is
# comfortably above what any one of those needs on its own, covers running
# two separate headless-Chrome processes across the run without either being
# starved, and leaves meaningful headroom for Node/V8 overhead — while still
# being a small fraction of the 8 vCPU / 32 GiB ceiling. Over-provisioning
# this is pure wasted spend on a pilot whose whole point (per the index plan)
# is running cheap; scale up only if a real run's logs show it OOMing or CPU-
# throttling.
#
# TIMEOUT — 900s (15 minutes), not anywhere near the 168-hour cap. The
# longest single step in `job.ts`'s pipeline is Instagram's own container-
# processing poll, bounded at "once a minute, max 5 minutes" per the plan's
# own Constraint (`instagram.ts`'s `POLL_MAX_ATTEMPTS`); render, R2 upload,
# and the YouTube resumable upload are each on the order of seconds to low
# minutes for a ~59s vertical video. 15 minutes leaves several minutes of
# headroom over the realistic worst case (a full 5-minute IG poll plus a slow
# render/upload) without leaving a stuck run silently occupying billed
# compute for hours.
#
# MAX RETRIES — 0, not Cloud Run's usual default. `job.ts`'s publish steps
# are NOT idempotent from a viewer's point of view: a retried execution would
# re-render the same day's card and re-attempt Instagram/YouTube publish,
# which (if the first attempt actually succeeded on one platform before
# failing on the other, or failed only in bookkeeping after a real post) can
# duplicate-post to a live audience. A failed run needs a human to read
# `content/social/job-logs/job-<date>.log` (mirrored to Cloud Logging) and
# decide what to re-run and how — see `social/DEPLOY.md`'s "verify a
# scheduled run" section — not an automatic retry.
#
# SECRETS — every credential-shaped value is a Secret Manager reference
# (`valueFrom.secretKeyRef`), never a literal in this checked-in file, per
# the plan's Constraint: "Store them in Secret Manager or Firestore, never
# env vars." The Instagram/YouTube OAuth TOKENS themselves are NOT listed
# here at all — they live in Firestore (`social/src/publish/token-store-
# firestore.ts`, T04), read at runtime via this job's own service-account
# identity (Application Default Credentials), so they never pass through an
# env var, secret or otherwise. What IS listed here are the R2 object-storage
# credentials (genuinely secret) and the Instagram business account id
# (`IG_USER_ID` — not itself sensitive, but account-specific and kept out of
# a checked-in file for the same reason the R2 values are: nothing account-
# specific belongs hardcoded in version control). `key: "latest"` always
# resolves to each secret's newest version — see `social/DEPLOY.md` for how
# to rotate a value (add a new version; Cloud Run picks it up on the next
# execution without a config change here).
apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: plain-social-daily
  labels:
    cloud.googleapis.com/location: us-central1
spec:
  template:
    spec:
      taskCount: 1
      template:
        spec:
          serviceAccountName: plain-social-job@PROJECT_ID.iam.gserviceaccount.com
          timeoutSeconds: 900
          maxRetries: 0
          containers:
            - image: us-central1-docker.pkg.dev/PROJECT_ID/plain-social/plain-social:latest
              resources:
                limits:
                  cpu: '2'
                  memory: 4Gi
              # No `args:` here at all — Cloud Run falls back to the image's
              # own `CMD ["--help"]` (see `social/Dockerfile`), the same
              # safe no-args default `docker run plain-social` alone prints
              # locally. `--date` is intentionally NOT baked in here either:
              # the Cloud Run Admin API `jobs.run` call the Firebase trigger
              # makes (`functions/src/socialTrigger.ts`) supplies it per
              # execution via a `containerOverrides.args` override, so this
              # job config stays date-agnostic and reusable for every
              # scheduled run (and for an ad-hoc manual run with a different
              # `--date`, passed the same way via `gcloud run jobs execute
              # --args`).
              env:
                - name: R2_ACCOUNT_ID
                  valueFrom:
                    secretKeyRef:
                      name: social-pilot-r2-account-id
                      key: latest
                - name: R2_BUCKET_NAME
                  valueFrom:
                    secretKeyRef:
                      name: social-pilot-r2-bucket-name
                      key: latest
                - name: R2_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: social-pilot-r2-access-key-id
                      key: latest
                - name: R2_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: social-pilot-r2-secret-access-key
                      key: latest
                - name: R2_PUBLIC_BASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: social-pilot-r2-public-base-url
                      key: latest
                - name: IG_USER_ID
                  valueFrom:
                    secretKeyRef:
                      name: social-pilot-ig-user-id
                      key: latest
